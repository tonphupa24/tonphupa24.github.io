<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Planner OS — โต๊ะนักวางแผนธุรกิจ</title>
<style>
:root{
  --fb:system-ui,-apple-system,"Segoe UI","Sukhumvit Set","Leelawadee UI","Noto Sans Thai",Tahoma,Arial,sans-serif;
  --fd:"Trebuchet MS","Sukhumvit Set","Leelawadee UI","Noto Sans Thai",system-ui,sans-serif;
  --fm:ui-monospace,"SF Mono",Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace;
  --paper:#F1F3F0;
  --canvas:#FFFFFF;
  --ink:#16223A;
  --ink-2:#243450;
  --sidebar:#111A2E;
  --sidebar-2:#0B1322;
  --sidebar-line:#22304B;
  --line:#E3E6EC;
  --line-2:#EDEFF3;
  --muted:#6B7689;
  --muted-2:#94A0B2;
  --accent:#C7973F;
  --accent-deep:#A87B23;
  --accent-soft:#F6ECD3;
  --teal:#2E6F6A;
  --danger:#B4452F;
  --ok:#3F7D4E;
  /* category colors */
  --c-STR:#2C3E66; --c-MKT:#2E6F6A; --c-FIN:#A8761A; --c-ACC:#6B4A7A;
  --c-PRD:#3A5A78; --c-PUR:#5E6B3A; --c-OPS:#475569; --c-IDEA:#B4533A;
  --shadow:0 1px 2px rgba(16,28,55,.06), 0 8px 24px -12px rgba(16,28,55,.18);
  --shadow-lg:0 24px 60px -28px rgba(16,28,55,.45);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--fb);
  background:var(--paper);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--accent-soft)}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:288px 1fr;min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{
  background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));
  color:#C7D0E0;position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid var(--sidebar-line);
}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:#28344f;border-radius:8px}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--sidebar-line)}
.brand .logo{display:flex;align-items:center;gap:11px}
.brand .mark{
  width:34px;height:34px;border-radius:9px;flex:none;position:relative;
  background:linear-gradient(135deg,var(--accent),#E4C172);
  display:grid;place-items:center;color:#1A1305;font-weight:700;
  font-family:var(--fd);font-size:16px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
}
.brand .mark::after{content:"";position:absolute;inset:5px;border:1.5px solid rgba(26,19,5,.35);border-radius:5px}
.brand h1{font-family:var(--fd);font-size:15px;letter-spacing:.2px;color:#fff;margin:0;font-weight:600}
.brand .sub{font-family:var(--fm);font-size:10.5px;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin-top:2px}

.nav{padding:12px 12px 40px}
.nav-group{margin-bottom:4px}
.nav-cat{
  width:100%;display:flex;align-items:center;gap:9px;background:none;border:none;
  color:#8FA0BC;padding:9px 10px;border-radius:9px;text-align:left;
  font-size:12px;font-family:var(--fm);letter-spacing:1px;text-transform:uppercase;font-weight:500;
}
.nav-cat:hover{background:rgba(255,255,255,.04);color:#C7D0E0}
.nav-cat .dot{width:8px;height:8px;border-radius:3px;flex:none}
.nav-cat .chev{margin-left:auto;transition:transform .2s;font-size:10px;opacity:.6}
.nav-group.open .nav-cat .chev{transform:rotate(90deg)}
.nav-items{display:none;padding:2px 0 8px 8px;margin-left:13px;border-left:1px solid var(--sidebar-line)}
.nav-group.open .nav-items{display:block}
.nav-item{
  width:100%;display:flex;align-items:center;gap:9px;background:none;border:none;
  color:#A9B5CA;padding:7px 10px;border-radius:8px;text-align:left;font-size:13.5px;line-height:1.35;
  font-family:inherit;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:rgba(199,151,63,.14);color:#fff}
.nav-item.active .code{color:var(--accent)}
.nav-item .code{font-family:var(--fm);font-size:10px;color:#6E7C97;flex:none;letter-spacing:.5px}
.nav-item .fill{margin-left:auto;width:6px;height:6px;border-radius:50%;background:#33425f;flex:none}
.nav-item .fill.on{background:var(--accent)}

/* ---------- Main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(241,243,240,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:16px;
}
.menu-btn{display:none}
.ws-name{
  font-family:var(--fd);font-weight:600;font-size:17px;color:var(--ink);
  border:none;background:none;padding:4px 6px;border-radius:8px;min-width:120px;max-width:340px;width:auto;
}
.ws-name:hover{background:#fff}
.ws-name:focus{outline:2px solid var(--accent);background:#fff}
.topbar .spacer{flex:1}
.save-pill{
  font-family:var(--fm);font-size:11px;letter-spacing:.5px;color:var(--muted);
  display:flex;align-items:center;gap:6px;
}
.save-pill .led{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(63,125,78,.15)}
.save-pill.saving .led{background:var(--accent);box-shadow:0 0 0 3px rgba(199,151,63,.18)}
.tbtn{
  border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:9px;
  padding:8px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;
}
.tbtn:hover{border-color:var(--ink-2);color:var(--ink)}
.tbtn svg{width:15px;height:15px}

.scroll{flex:1;overflow-y:auto}
.page{max-width:1180px;margin:0 auto;padding:34px 28px 90px}

/* ---------- Framework header ---------- */
.fw-head{margin-bottom:26px;display:flex;align-items:flex-start;gap:18px}
.fw-code{
  font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:1px;color:#fff;
  padding:6px 10px;border-radius:8px;flex:none;margin-top:3px;
}
.fw-head h2{font-family:var(--fd);font-size:27px;font-weight:600;margin:0;letter-spacing:-.4px;line-height:1.15}
.fw-head .tag{font-family:var(--fm);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-2);margin:2px 0 0}
.fw-actions{margin-left:auto;display:flex;gap:8px;flex:none}

/* ---------- Guide ---------- */
.guide{
  background:linear-gradient(180deg,#fff,#FCFBF6);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:12px;padding:14px 18px;margin-bottom:24px;color:var(--ink-2);font-size:13.5px;
}
.guide .gh{display:flex;align-items:center;gap:8px;font-weight:600;font-family:var(--fd);color:var(--ink);margin-bottom:4px;font-size:13.5px}
.guide .gh svg{width:15px;height:15px;color:var(--accent-deep)}
.guide p{margin:0}
.guide b{color:var(--accent-deep)}

/* ---------- Canvas blocks ---------- */
.canvas-grid{display:grid;gap:14px}
.block{
  background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:16px 16px 6px;
  box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;min-height:120px;
}
.block::before{content:"";position:absolute;top:10px;right:10px;width:10px;height:10px;border-top:1.5px solid var(--line);border-right:1.5px solid var(--line)}
.block .bt{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.block .bnum{font-family:var(--fm);font-size:10px;color:var(--accent-deep);font-weight:600;flex:none}
.block .blabel{font-family:var(--fd);font-weight:600;font-size:14px;color:var(--ink)}
.block .bhint{font-size:11.5px;color:var(--muted-2);margin:-3px 0 8px;line-height:1.45}
.block textarea{
  flex:1;border:none;background:none;resize:vertical;width:100%;font-family:inherit;font-size:13.5px;
  color:var(--ink-2);line-height:1.6;min-height:62px;padding:0;
}
.block textarea:focus{outline:none}
.block textarea::placeholder{color:#BCC4D1}
.block:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(199,151,63,.12)}

/* ---------- Tables ---------- */
.table-wrap{background:var(--canvas);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.table-scroll{overflow-x:auto}
table.fw{border-collapse:collapse;width:100%;min-width:560px}
table.fw th{
  background:#F7F8FA;text-align:left;font-family:var(--fm);font-size:10.5px;letter-spacing:.6px;
  text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.fw td{border-bottom:1px solid var(--line-2);padding:0;vertical-align:top}
table.fw tr:last-child td{border-bottom:none}
table.fw td .cell{width:100%}
table.fw input,table.fw textarea,table.fw select{
  width:100%;border:none;background:none;font-family:inherit;font-size:13.5px;color:var(--ink-2);
  padding:10px 12px;line-height:1.5;
}
table.fw textarea{resize:vertical;min-height:40px}
table.fw input:focus,table.fw textarea:focus,table.fw select:focus{outline:none;background:#FCFAF3;box-shadow:inset 0 0 0 2px rgba(199,151,63,.25)}
table.fw input[type=number]{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--fm);font-size:13px}
table.fw td.num{text-align:right}
table.fw .calc-cell{padding:10px 12px;font-family:var(--fm);font-size:13px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;background:#FAFBFC}
.row-del{
  width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:none;color:var(--muted-2);
  display:grid;place-items:center;margin:7px auto;
}
.row-del:hover{background:#FBEEEA;color:var(--danger);border-color:#F0D3CB}
table.fw td.ctrl{width:40px;text-align:center}
table.fw tfoot td{background:#F7F8FA;border-top:2px solid var(--line);padding:11px 12px;font-family:var(--fm);
  font-size:13px;font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
table.fw tfoot td.lbl{text-align:left;text-transform:uppercase;letter-spacing:.6px;font-size:10.5px;color:var(--muted)}
.chk-cell{display:grid;place-items:center;padding:10px}
.chk-cell input{width:18px;height:18px;accent-color:var(--accent-deep)}
.add-row{
  width:100%;border:none;background:#FBFBFA;border-top:1px solid var(--line);color:var(--accent-deep);
  padding:11px;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;
}
.add-row:hover{background:var(--accent-soft)}

/* ---------- Summary panel ---------- */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.stat{background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .sl{font-family:var(--fm);font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.stat .sv{font-family:var(--fd);font-size:23px;font-weight:600;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums}
.stat .sv.good{color:var(--ok)} .stat .sv.bad{color:var(--danger)} .stat .sv.warn{color:var(--accent-deep)}
.stat .sd{font-size:11.5px;color:var(--muted-2);margin-top:2px}

/* ---------- Calculators ---------- */
.calc{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
.calc-inputs{background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field .fh{font-size:11px;color:var(--muted-2);font-weight:400;margin-left:6px}
.field input{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-family:var(--fm);
  font-size:14px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;
}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(199,151,63,.12)}
.calc-out{display:flex;flex-direction:column;gap:18px}

/* ---------- Cards (personas) ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{background:var(--canvas);border:1px solid var(--line);border-radius:14px;padding:0;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.pcard .ph{background:linear-gradient(135deg,#1D2B49,#2C3E66);padding:14px 16px;display:flex;align-items:center;gap:10px}
.pcard .pav{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#1A1305;display:grid;place-items:center;font-weight:700;font-family:var(--fd);flex:none}
.pcard .pname{flex:1}
.pcard .pname input{background:none;border:none;color:#fff;font-family:var(--fd);font-weight:600;font-size:15px;width:100%;padding:0}
.pcard .pname input:focus{outline:none}
.pcard .pdel{background:rgba(255,255,255,.1);border:none;color:#C7D0E0;width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.pcard .pdel:hover{background:var(--danger);color:#fff}
.pcard .pbody{padding:6px 14px 12px}
.pfield{padding:9px 0;border-bottom:1px solid var(--line-2)}
.pfield:last-child{border-bottom:none}
.pfield .pl{font-family:var(--fm);font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.pfield textarea{width:100%;border:none;background:none;resize:vertical;font-family:inherit;font-size:13px;color:var(--ink-2);min-height:30px;line-height:1.5}
.pfield textarea:focus{outline:none}
.add-card{
  border:1.5px dashed var(--line);background:#fff;border-radius:14px;display:grid;place-items:center;min-height:120px;
  color:var(--accent-deep);font-weight:600;gap:6px;
}
.add-card:hover{border-color:var(--accent);background:#FCFAF3}

/* ---------- Idea board ---------- */
.board-tools{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.swatch.sel{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.board{column-width:240px;column-gap:16px}
.note{
  break-inside:avoid;margin-bottom:16px;border-radius:12px;padding:14px;position:relative;
  box-shadow:0 2px 4px rgba(16,28,55,.1),0 10px 22px -14px rgba(16,28,55,.4);min-height:90px;
}
.note textarea{width:100%;border:none;background:none;resize:vertical;font-family:inherit;font-size:14px;
  color:#2A2417;line-height:1.55;min-height:60px}
.note textarea:focus{outline:none}
.note .ndel{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:6px;border:none;
  background:rgba(0,0,0,.07);color:#5A4F38;display:grid;place-items:center;opacity:0;transition:.15s}
.note:hover .ndel{opacity:1}
.note .ndel:hover{background:rgba(0,0,0,.18)}
.note .ntag{font-family:var(--fm);font-size:9.5px;letter-spacing:.5px;color:rgba(0,0,0,.4);margin-bottom:5px}

/* ---------- Free text ---------- */
.scratch{background:var(--canvas);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:0}
.scratch textarea{width:100%;border:none;background:repeating-linear-gradient(transparent,transparent 31px,#EEF1F4 31px,#EEF1F4 32px);
  resize:vertical;font-family:inherit;font-size:15px;line-height:32px;color:var(--ink-2);padding:14px 22px;min-height:560px}
.scratch textarea:focus{outline:none}

/* ---------- Dashboard ---------- */
.hero{
  background:linear-gradient(135deg,#16223A 0%,#1E2D4E 55%,#243450 100%);color:#fff;border-radius:18px;
  padding:34px 36px;position:relative;overflow:hidden;margin-bottom:28px;box-shadow:var(--shadow-lg);
}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(199,151,63,.32),transparent 65%)}
.hero .eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.hero h2{font-family:var(--fd);font-size:32px;font-weight:600;margin:0 0 8px;letter-spacing:-.6px;max-width:640px;line-height:1.18}
.hero p{margin:0;max-width:560px;color:#B9C4D8;font-size:14.5px}
.hero .one{margin-top:18px}
.hero .one input{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:10px;
  padding:11px 14px;font-family:inherit;font-size:14px;width:100%;max-width:520px;
}
.hero .one input::placeholder{color:#7E8CA6}
.hero .one input:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.12)}
.prog-wrap{margin-top:22px;max-width:520px}
.prog-bar{height:8px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#E4C172);border-radius:6px;transition:width .5s}
.prog-lbl{font-family:var(--fm);font-size:11px;color:#9AA7BE;margin-top:8px;letter-spacing:.5px}

.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.dcat{background:var(--canvas);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);text-align:left;display:block;width:100%;border-left:3px solid}
.dcat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.dcat{transition:transform .15s,box-shadow .15s}
.dcat .dcode{font-family:var(--fm);font-size:10px;letter-spacing:1px;font-weight:600}
.dcat h3{font-family:var(--fd);font-size:17px;margin:8px 0 4px;font-weight:600;color:var(--ink)}
.dcat p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.dcat .dcount{font-family:var(--fm);font-size:11px;color:var(--muted-2);margin-top:12px}

.section-title{font-family:var(--fm);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
  margin:34px 0 16px;display:flex;align-items:center;gap:12px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- Modal / toast ---------- */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
  transition:.25s;z-index:100;font-weight:500}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.scrim{position:fixed;inset:0;background:rgba(11,19,34,.5);backdrop-filter:blur(3px);display:none;place-items:center;z-index:90;padding:20px}
.scrim.show{display:grid}
.modal{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:26px;box-shadow:var(--shadow-lg)}
.modal h3{font-family:var(--fd);margin:0 0 8px;font-size:19px}
.modal p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.btn-ghost{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 16px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.btn-danger{border:none;background:var(--danger);color:#fff;border-radius:9px;padding:9px 16px;font-weight:600;font-size:13.5px}
.btn-ghost:hover{border-color:var(--ink-2)} .btn-danger:hover{background:#9c3a26}

/* ---------- Responsive ---------- */
@media(max-width:980px){
  .calc{grid-template-columns:1fr}
}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:60;width:288px;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .menu-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;
    width:38px;height:38px;border-radius:9px;color:var(--ink)}
  .scrim-nav{position:fixed;inset:0;background:rgba(11,19,34,.4);z-index:55;display:none}
  .scrim-nav.show{display:block}
  .page{padding:24px 16px 80px}
  .topbar{padding:12px 16px}
  .ws-name{font-size:15px}
  .fw-head h2{font-size:22px}
  .hero{padding:26px 22px}.hero h2{font-size:25px}
  .fw-actions .tbtn span{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Print ---------- */
@media print{
  .sidebar,.topbar,.fw-actions,.add-row,.add-card,.row-del,.ndel,.pdel,.board-tools,.menu-btn{display:none!important}
  .app{grid-template-columns:1fr}.scroll{overflow:visible}

/* ====================== STATE ====================== */
const NOTE_COLORS=["#FCE8A8","#CDEBC5","#BFE0F2","#F4CFD9","#E5D4F0","#FAD9B8"];
let state = load();
let current = state.current || "HOME";

function defaultState(){return {meta:{name:"ธุรกิจของฉัน",oneliner:""},data:{},current:"HOME"};}
function load(){
  try{const r=SS.get(STORE_KEY);if(r)return Object.assign(defaultState(),JSON.parse(r));}catch(e){}
  return defaultState();
}
let saveTimer=null;
function save(){
  const pill=document.getElementById("savePill");
  pill.classList.add("saving");document.getElementById("saveText").textContent="กำลังบันทึก…";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    state.current=current;
    try{SS.set(STORE_KEY,JSON.stringify(state));}catch(e){}
    pill.classList.remove("saving");document.getElementById("saveText").textContent="บันทึกแล้ว";
    updateNavFill();
  },350);
}
function fwData(code){if(!state.data[code])state.data[code]=null;return state.data[code];}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n;}
function fmt(n){if(!isFinite(n))return "—";return Math.round(n).toLocaleString("th-TH");}
function fmt2(n){if(!isFinite(n))return "—";return (Math.round(n*10)/10).toLocaleString("th-TH");}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function catColor(cat){return getComputedStyle(document.documentElement).getPropertyValue("--c-"+cat).trim();}

/* is a framework filled? */
function isFilled(code){
  const fw=FW.find(f=>f.code===code);const d=state.data[code];
  if(!d)return false;
  if(fw.type==="canvas")return Object.values(d).some(v=>v&&v.trim());
  if(fw.type==="text")return d&&d.trim&&d.trim();
  if(fw.type==="board")return Array.isArray(d)&&d.some(n=>n.text&&n.text.trim());
  if(fw.type==="cards")return Array.isArray(d)&&d.some(c=>Object.entries(c).some(([k,v])=>k!=="_name"&&v&&(""+v).trim()));
  if(fw.type==="table")return Array.isArray(d)&&d.some(r=>Object.values(r).some(v=>v&&(""+v).trim()));
  if(fw.type==="calc")return d&&Object.values(d).some(v=>v&&(""+v).trim());
  return false;
}

/* ====================== NAV ====================== */
function buildNav(){
  const nav=document.getElementById("nav");nav.innerHTML="";
  CATS.forEach(cat=>{
    if(cat.id==="HOME"){
      const g=document.createElement("div");g.className="nav-group";
      const b=document.createElement("button");b.className="nav-cat";b.dataset.cat="HOME";
      b.innerHTML=`<span class="dot" style="background:var(--accent)"></span>ภาพรวม`;
      b.onclick=()=>select("HOME");
      g.appendChild(b);nav.appendChild(g);return;
    }
    const items=FW.filter(f=>f.cat===cat.id);
    const g=document.createElement("div");g.className="nav-group";g.dataset.cat=cat.id;
    const head=document.createElement("button");head.className="nav-cat";
    head.innerHTML=`<span class="dot" style="background:var(--c-${cat.id})"></span>${cat.name}<span class="chev">▶</span>`;
    head.onclick=()=>{g.classList.toggle("open");};
    const list=document.createElement("div");list.className="nav-items";
    items.forEach(f=>{
      const it=document.createElement("button");it.className="nav-item";it.dataset.code=f.code;
      it.innerHTML=`<span class="code">${f.code.split("-")[1]}</span><span>${f.title}</span><span class="fill"></span>`;
      it.onclick=()=>select(f.code);
      list.appendChild(it);
    });
    g.appendChild(head);g.appendChild(list);nav.appendChild(g);
  });
}
function updateNavFill(){
  document.querySelectorAll(".nav-item").forEach(it=>{
    const f=it.querySelector(".fill");
    if(isFilled(it.dataset.code))f.classList.add("on");else f.classList.remove("on");
  });
}
function setActiveNav(){
  document.querySelectorAll(".nav-item").forEach(it=>it.classList.toggle("active",it.dataset.code===current));
  if(current!=="HOME"){
    const fw=FW.find(f=>f.code===current);
    const g=document.querySelector(`.nav-group[data-cat="${fw.cat}"]`);
    if(g)g.classList.add("open");
  }
}

function select(code){
  current=code;render();setActiveNav();save();
  document.getElementById("scroll").scrollTop=0;
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("scrimNav").classList.remove("show");
}

/* ====================== RENDER ====================== */
const page=document.getElementById("page");
function render(){
  if(current==="HOME"){renderHome();return;}
  const fw=FW.find(f=>f.code===current);if(!fw){renderHome();return;}
  let html=fwHeader(fw)+guideBox(fw);
  if(fw.type==="canvas")html+=renderCanvas(fw);
  else if(fw.type==="table")html+=renderTable(fw);
  else if(fw.type==="cards")html+=renderCards(fw);
  else if(fw.type==="board")html+=renderBoard(fw);
  else if(fw.type==="text")html+=renderText(fw);
  else if(fw.type==="calc")html+=renderCalc(fw);
  page.innerHTML=html;
  wire(fw);
}

function fwHeader(fw){
  const cat=CATS.find(c=>c.id===fw.cat);
  return `<div class="fw-head">
    <span class="fw-code" style="background:var(--c-${fw.cat})">${fw.code}</span>
    <div><h2>${fw.title}</h2><div class="tag">${cat.name}</div></div>
    <div class="fw-actions">
      <button class="tbtn" id="resetFw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg><span>ล้างหน้านี้</span></button>
    </div>
  </div>`;
}
function guideBox(fw){
  return `<div class="guide"><div class="gh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>วิธีใช้ & ไกด์</div><p>${fw.guide}</p></div>`;
}

/* ---- CANVAS ---- */
function renderCanvas(fw){
  const d=fwData(fw.code)||{};
  let g=`<div class="canvas-grid" style="grid-template-columns:repeat(${fw.cols},1fr)">`;
  fw.blocks.forEach((b,i)=>{
    const span=Math.min(b.span||1,fw.cols);
    g+=`<div class="block" style="grid-column:span ${span}">
      <div class="bt"><span class="bnum">${String(i+1).padStart(2,"0")}</span><span class="blabel">${b.t}</span></div>
      ${b.h?`<div class="bhint">${b.h}</div>`:""}
      <textarea data-block="${b.k}" placeholder="เริ่มเขียนที่นี่…">${esc(d[b.k])}</textarea>
    </div>`;
  });
  return g+`</div>`;
}

/* ---- TABLE ---- */
function tableRows(fw){
  let d=fwData(fw.code);
  if(!Array.isArray(d)){d=(fw.seed?JSON.parse(JSON.stringify(fw.seed)):[{}]);state.data[fw.code]=d;}
  return d;
}
function renderTable(fw){
  const rows=tableRows(fw);
  let h=`<div class="table-wrap"><div class="table-scroll"><table class="fw"><thead><tr>`;
  fw.cols.forEach(c=>{h+=`<th${c.t==="num"||c.t==="calc"?' class="num"':''} ${c.w?`style="width:${c.w}"`:''}>${c.l}</th>`;});
  h+=`<th class="ctrl"></th></tr></thead><tbody>`;
  rows.forEach((r,ri)=>{
    h+=`<tr data-ri="${ri}">`;
    fw.cols.forEach(c=>{
      if(c.t==="calc"){
        const v=c.fn(r,ri,rows);
        h+=`<td class="num"><div class="calc-cell" data-calc="${c.k}">${typeof v==="number"?fmt2(v):esc(v)}</div></td>`;
      }else if(c.t==="chk"){
        h+=`<td><div class="chk-cell"><input type="checkbox" data-col="${c.k}" ${r[c.k]?"checked":""}></div></td>`;
      }else if(c.t==="sel"){
        h+=`<td><select data-col="${c.k}"><option value="">—</option>${c.opts.map(o=>`<option ${r[c.k]===o?"selected":""}>${o}</option>`).join("")}</select></td>`;
      }else if(c.t==="area"){
        h+=`<td><textarea data-col="${c.k}" rows="1">${esc(r[c.k])}</textarea></td>`;
      }else if(c.t==="num"){
        h+=`<td class="num"><input type="number" step="any" data-col="${c.k}" value="${r[c.k]!=null?esc(""+r[c.k]):""}"></td>`;
      }else if(c.t==="date"){
        h+=`<td><input type="date" data-col="${c.k}" value="${esc(r[c.k])}"></td>`;
      }else{
        h+=`<td><input type="text" data-col="${c.k}" value="${esc(r[c.k])}"></td>`;
      }
    });
    h+=`<td class="ctrl"><button class="row-del" data-del="${ri}" title="ลบแถว"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-9 0v14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6"/></svg></button></td>`;
    h+=`</tr>`;
  });
  h+=`</tbody>`;
  if(fw.footer){
    h+=`<tfoot><tr><td class="lbl">รวม</td>`;
    let started=true;
    fw.cols.slice(1).forEach(c=>{
      if(fw.footer.includes(c.k)){
        const sum=rows.reduce((a,r)=>a+(c.t==="calc"?num(c.fn(r,0,rows)):num(r[c.k])),0);
        h+=`<td data-foot="${c.k}">${fmt(sum)}</td>`;
      }else h+=`<td></td>`;
    });
    h+=`<td></td></tr></tfoot>`;
  }
  h+=`</table></div><button class="add-row" id="addRow"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>เพิ่มแถว</button></div>`;
  if(fw.summary)h+=summaryPanel(fw,rows);

/* ---- summaries ---- */
function summaryPanel(fw,rows){
  if(fw.summary==="pnl"){
    const cats=["รายได้","ต้นทุนขาย (COGS)","ค่าใช้จ่ายดำเนินงาน"];
    const sum=c=>rows.filter(r=>r.cat===c).reduce((a,r)=>a+num(r.q1)+num(r.q2)+num(r.q3)+num(r.q4),0);
    const rev=sum("รายได้"),cogs=sum("ต้นทุนขาย (COGS)"),opex=sum("ค่าใช้จ่ายดำเนินงาน");
    const gross=rev-cogs,net=gross-opex;
    const gm=rev>0?gross/rev*100:0,nm=rev>0?net/rev*100:0;
    return `<div class="summary">
      ${stat("รายได้รวม/ปี",fmt(rev)+" ฿")}
      ${stat("กำไรขั้นต้น",fmt(gross)+" ฿","",`อัตรา ${fmt2(gm)}%`)}
      ${stat("กำไรสุทธิ",fmt(net)+" ฿",net>=0?"good":"bad",`อัตรา ${fmt2(nm)}%`)}
    </div>`;
  }
  if(fw.summary==="journal"){
    const dr=rows.reduce((a,r)=>a+num(r.debit),0),cr=rows.reduce((a,r)=>a+num(r.credit),0);
    const diff=dr-cr;
    return `<div class="summary">
      ${stat("รวมเดบิต",fmt(dr)+" ฿")}
      ${stat("รวมเครดิต",fmt(cr)+" ฿")}
      ${stat("สถานะสมดุล",diff===0?"สมดุล ✓":"ไม่สมดุล",diff===0?"good":"bad",diff===0?"เดบิต = เครดิต":`ต่างกัน ${fmt(Math.abs(diff))} ฿`)}
    </div>`;
  }
  return "";
}
function stat(label,val,cls="",desc=""){
  return `<div class="stat"><div class="sl">${label}</div><div class="sv ${cls}">${val}</div>${desc?`<div class="sd">${desc}</div>`:""}</div>`;
}

/* ---- CALC ---- */
function calcData(fw){let d=fwData(fw.code);if(!d||typeof d!=="object"){d={};state.data[fw.code]=d;}return d;}
function renderCalc(fw){
  const d=calcData(fw);
  if(fw.calcId==="breakeven"){
    return `<div class="calc">
      <div class="calc-inputs">
        ${field("fc","ต้นทุนคงที่ / เดือน","฿ — เช่า เงินเดือน ที่จ่ายเท่าเดิม",d.fc)}
        ${field("price","ราคาขาย / หน่วย","฿",d.price)}
        ${field("vc","ต้นทุนผันแปร / หน่วย","฿ — วัตถุดิบ ค่าส่ง ต่อชิ้น",d.vc)}
      </div>
      <div class="calc-out" id="calcOut"></div>
    </div>`;
  }
  if(fw.calcId==="unit"){
    return `<div class="calc">
      <div class="calc-inputs">
        ${field("cac","ต้นทุนหาลูกค้า (CAC)","฿ ต่อลูกค้า 1 คน",d.cac)}
        ${field("price","รายได้ต่อการซื้อ","฿",d.price)}
        ${field("cost","ต้นทุนต่อการซื้อ","฿",d.cost)}
        ${field("freq","จำนวนครั้งซื้อ / ปี","ครั้ง",d.freq)}
        ${field("years","อายุลูกค้าเฉลี่ย","ปี",d.years)}
      </div>
      <div class="calc-out" id="calcOut"></div>
    </div>`;
  }
  return "";
}
function field(k,l,h,v){return `<div class="field"><label>${l}<span class="fh">${h}</span></label><input type="number" step="any" data-calc="${k}" value="${v!=null?esc(""+v):""}"></div>`;}
function computeCalc(fw){
  const d=calcData(fw);const out=document.getElementById("calcOut");if(!out)return;
  if(fw.calcId==="breakeven"){
    const fc=num(d.fc),p=num(d.price),vc=num(d.vc);
    const cm=p-vc;const ok=cm>0;
    const units=ok?fc/cm:Infinity;const rev=ok?units*p:Infinity;
    out.innerHTML=`<div class="summary" style="margin-top:0">
      ${stat("กำไรต่อหน่วย",ok?fmt2(cm)+" ฿":"—",ok?"good":"bad","ราคา − ต้นทุนผันแปร")}
      ${stat("จุดคุ้มทุน",ok?fmt(units)+" หน่วย":"ขาดทุนทุกหน่วย",ok?"warn":"bad","ต่อเดือน")}
      ${stat("ยอดขายคุ้มทุน",ok?fmt(rev)+" ฿":"—","","รายได้/เดือนขั้นต่ำ")}
    </div>${ok?beChart(fc,cm,p,units):`<div class="guide" style="border-left-color:var(--danger);margin-top:18px"><p>⚠️ ราคาขายต่ำกว่าหรือเท่ากับต้นทุนผันแปร — ยิ่งขายยิ่งขาดทุน ต้องขึ้นราคาหรือลดต้นทุนต่อหน่วยก่อน</p></div>`}`;
  }
  if(fw.calcId==="unit"){
    const cac=num(d.cac),p=num(d.price),c=num(d.cost),f=num(d.freq),y=num(d.years);
    const margin=p-c;const ltv=margin*f*y;const ratio=cac>0?ltv/cac:0;
    const payback=margin*f>0?cac/(margin*f)*12:Infinity;
    const ratioCls=ratio>=3?"good":ratio>=1?"warn":"bad";
    out.innerHTML=`<div class="summary" style="margin-top:0">
      ${stat("กำไรต่อการซื้อ",fmt2(margin)+" ฿","","ราคา − ต้นทุน")}
      ${stat("มูลค่าตลอดอายุ (LTV)",fmt(ltv)+" ฿","","กำไร × ความถี่ × ปี")}
      ${stat("LTV : CAC",ratio>0?fmt2(ratio)+" : 1":"—",ratioCls,ratio>=3?"ดีมาก (≥3)":ratio>=1?"พอได้ ควรดันให้ถึง 3":"ขาดทุน — CAC สูงเกิน")}
      ${stat("ระยะคืนทุน",isFinite(payback)?fmt2(payback)+" เดือน":"—","","คืนค่าหาลูกค้า")}
    </div>`;
  }
}
function beChart(fc,cm,p,beUnits){
  const W=560,H=240,pad=42;
  const maxU=Math.max(beUnits*1.8,10);
  const maxY=Math.max(maxU*p,fc*1.6);
  const x=u=>pad+(u/maxU)*(W-pad-20);
  const y=v=>H-pad-(v/maxY)*(H-pad-20);
  const revLine=`M ${x(0)} ${y(0)} L ${x(maxU)} ${y(maxU*p)}`;
  const costLine=`M ${x(0)} ${y(fc)} L ${x(maxU)} ${y(fc+maxU*cm)}`;
  const bx=x(beUnits),by=y(beUnits*p);
  return `<div class="table-wrap" style="padding:16px;margin-top:6px">
   <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;font-family:var(--fm)">
    <line x1="${pad}" y1="${H-pad}" x2="${W-20}" y2="${H-pad}" stroke="#D5DAE2"/>
    <line x1="${pad}" y1="20" x2="${pad}" y2="${H-pad}" stroke="#D5DAE2"/>
    <path d="${costLine}" fill="none" stroke="var(--danger)" stroke-width="2.5"/>
    <path d="${revLine}" fill="none" stroke="var(--teal)" stroke-width="2.5"/>
    <circle cx="${bx}" cy="${by}" r="5" fill="var(--accent)" stroke="#fff" stroke-width="2"/>
    <line x1="${bx}" y1="${by}" x2="${bx}" y2="${H-pad}" stroke="var(--accent)" stroke-dasharray="3 3"/>
    <text x="${bx}" y="${H-pad+16}" fill="var(--accent-deep)" font-size="11" text-anchor="middle">คุ้มทุน ${fmt(beUnits)}</text>
    <text x="${W-22}" y="${y(maxU*p)-6}" fill="var(--teal)" font-size="11" text-anchor="end">รายได้</text>
    <text x="${W-22}" y="${y(fc+maxU*cm)-6}" fill="var(--danger)" font-size="11" text-anchor="end">ต้นทุนรวม</text>
   </svg></div>`;
}

/* ====================== WIRING ====================== */
function wire(fw){
  const reset=document.getElementById("resetFw");
  if(reset)reset.onclick=()=>confirmModal("ล้างข้อมูลหน้านี้?",`ข้อมูลในเครื่องมือ “${fw.title}” จะถูกลบทั้งหมด ย้อนกลับไม่ได้`,()=>{
    delete state.data[fw.code];render();save();toast("ล้างข้อมูลแล้ว");
  });

  if(fw.type==="canvas"){
    const d=state.data[fw.code]||(state.data[fw.code]={});
    page.querySelectorAll("textarea[data-block]").forEach(t=>{
      autoGrow(t);
      t.oninput=()=>{d[t.dataset.block]=t.value;autoGrow(t);save();};
    });
  }
  if(fw.type==="text"){
    const t=page.querySelector("textarea[data-text]");
    t.oninput=()=>{state.data[fw.code]=t.value;save();};
  }
  if(fw.type==="table")wireTable(fw);
  if(fw.type==="cards")wireCards(fw);
  if(fw.type==="board")wireBoard(fw);
  if(fw.type==="calc"){
    page.querySelectorAll("input[data-calc]").forEach(inp=>{
      inp.oninput=()=>{calcData(fw)[inp.dataset.calc]=inp.value;computeCalc(fw);save();};
    });
    computeCalc(fw);
  }
}

function wireTable(fw){
  const rows=tableRows(fw);
  const recalc=()=>{
    // update calc cells + footer without full rerender
    page.querySelectorAll("tr[data-ri]").forEach(tr=>{
      const ri=+tr.dataset.ri;
      tr.querySelectorAll(".calc-cell").forEach(cell=>{
        const c=fw.cols.find(x=>x.k===cell.dataset.calc);
        const v=c.fn(rows[ri],ri,rows);
        cell.textContent=typeof v==="number"?fmt2(v):v;
      });
    });
    if(fw.footer){
      fw.cols.slice(1).forEach(c=>{
        if(fw.footer.includes(c.k)){
          const td=page.querySelector(`tfoot td[data-foot="${c.k}"]`);
          if(td){const sum=rows.reduce((a,r)=>a+(c.t==="calc"?num(c.fn(r,0,rows)):num(r[c.k])),0);td.textContent=fmt(sum);}
        }
      });
    }
    if(fw.summary){
      const old=page.querySelector(".summary");
      const html=summaryPanel(fw,rows);
      if(old){const tmp=document.createElement("div");tmp.innerHTML=html;old.replaceWith(tmp.firstElementChild);}
    }
  };
  page.querySelectorAll("tr[data-ri]").forEach(tr=>{
    const ri=+tr.dataset.ri;
    tr.querySelectorAll("[data-col]").forEach(el=>{
      const col=el.dataset.col;
      if(el.tagName==="TEXTAREA")autoGrow(el);
      const handler=()=>{
        rows[ri][col]=(el.type==="checkbox")?el.checked:el.value;
        if(el.tagName==="TEXTAREA")autoGrow(el);
        recalc();save();
      };
      el.oninput=handler;el.onchange=handler;
    });
    const del=tr.querySelector("[data-del]");
    if(del)del.onclick=()=>{rows.splice(ri,1);if(rows.length===0)rows.push({});render();save();};
  });
  const add=document.getElementById("addRow");
  if(add)add.onclick=()=>{rows.push({});render();save();};
}

function wireCards(fw){
  const cards=cardData(fw);
  page.querySelectorAll(".pcard").forEach(pc=>{
    const ci=+pc.dataset.ci;
    pc.querySelectorAll("[data-cfield]").forEach(el=>{
      if(el.tagName==="TEXTAREA")autoGrow(el);
      el.oninput=()=>{
        cards[ci][el.dataset.cfield]=el.value;
        if(el.dataset.cfield==="_name")pc.querySelector(".pav").textContent=(el.value.trim().charAt(0)||"?");
        if(el.tagName==="TEXTAREA")autoGrow(el);
        save();
      };
    });
    const del=pc.querySelector("[data-cdel]");
    del.onclick=()=>{if(cards.length<=1){toast("ต้องมีอย่างน้อย 1 เพอร์โซนา");return;}cards.splice(ci,1);render();save();};
  });
  const add=document.getElementById("addCard");
  if(add)add.onclick=()=>{cards.push({_name:"เพอร์โซนาใหม่"});render();save();};
}

function wireBoard(fw){
  const notes=boardData(fw);
  page.querySelectorAll("[data-note]").forEach(t=>{
    autoGrow(t);
    t.oninput=()=>{notes[+t.dataset.note].text=t.value;autoGrow(t);save();};
  });
  page.querySelectorAll("[data-ndel]").forEach(b=>{
    b.onclick=()=>{notes.splice(+b.dataset.ndel,1);render();save();};
  });
  page.querySelectorAll("[data-swatch]").forEach(s=>{
    s.onclick=()=>{boardColor=s.dataset.swatch;page.querySelectorAll(".swatch").forEach(x=>x.classList.remove("sel"));s.classList.add("sel");};
  });
  const add=document.getElementById("addNote");
  if(add)add.onclick=()=>{notes.unshift({text:"",color:boardColor});render();save();
    const ta=page.querySelector('[data-note="0"]');if(ta)ta.focus();};
}

function autoGrow(t){t.style.height="auto";t.style.height=Math.max(t.scrollHeight,t.tagName==="TEXTAREA"?0:0)+"px";}

document.getElementById("wsName").oninput=function(){state.meta.name=this.value;save();};
document.getElementById("printBtn").onclick=()=>window.print();
document.getElementById("exportBtn").onclick=()=>{
  state.current=current;
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`${(state.meta.name||"business-plan").replace(/[^\w\u0E00-\u0E7F-]+/g,"_")}_planner.json`;
  a.click();toast("ดาวน์โหลดไฟล์สำรองแล้ว");
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=function(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const obj=JSON.parse(rd.result);
    if(!obj.data){throw new Error();}
    confirmModal("นำเข้าข้อมูล?","ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่ด้วยไฟล์ที่เลือก",()=>{
      state=Object.assign(defaultState(),obj);current=state.current||"HOME";
      buildNav();render();setActiveNav();updateNavFill();save();toast("นำเข้าข้อมูลเรียบร้อย");
    });
  }catch(err){toast("ไฟล์ไม่ถูกต้อง");}};
  rd.readAsText(f);e.target.value="";
};

const scrim=document.getElementById("scrim");let okFn=null;
function confirmModal(title,body,fn){
  document.getElementById("mTitle").textContent=title;
  document.getElementById("mBody").textContent=body;okFn=fn;scrim.classList.add("show");
}
document.getElementById("mCancel").onclick=()=>scrim.classList.remove("show");
document.getElementById("mOk").onclick=()=>{scrim.classList.remove("show");if(okFn)okFn();};
scrim.onclick=e=>{if(e.target===scrim)scrim.classList.remove("show");};

let toastTimer=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2200);}

/* mobile nav */
document.getElementById("menuBtn").onclick=()=>{
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("scrimNav").classList.toggle("show");
};
document.getElementById("scrimNav").onclick=()=>{
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("scrimNav").classList.remove("show");
};

/* ====================== INIT ====================== */
buildNav();render();setActiveNav();updateNavFill();
if(!__storageOK){
  var w=document.createElement("div");
  w.style.cssText="position:fixed;left:12px;bottom:12px;z-index:80;max-width:320px;background:#16223A;color:#fff;padding:11px 14px;border-radius:10px;font:12.5px/1.5 var(--fb);box-shadow:0 10px 30px rgba(0,0,0,.25)";
  w.innerHTML="โหมดชั่วคราว · เบราว์เซอร์นี้ไม่บันทึกถาวร — ใช้ปุ่ม “สำรอง” เพื่อเก็บไฟล์ไว้ แล้ว “นำเข้า” กลับมาใช้ต่อ";
  document.body.appendChild(w);setTimeout(function(){w.style.transition="opacity .4s";w.style.opacity="0";setTimeout(function(){w.remove();},500);},9000);
}
</script>
</body>
